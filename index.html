<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT 阅读器</title>
    <style>
        :root {
            --bg: #ffffff;
            --ink: #111111;
            --gray-1: #666666;
            --gray-2: #999999;
            --line: #e5e5e5;
            --accent: #E30613;
            --accent-bg: #fdf2f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            color: #c4c4c4;
            cursor: default;
        }

        select {
            font: inherit;
            color: inherit;
            border: 1px solid var(--line);
            background: #fff;
            padding: 4px 8px;
            border-radius: 0;
        }

        select:focus {
            outline: 1px solid var(--ink);
        }

        /* ---------- 状态 A：导入页 ---------- */
        #importView {
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: box-shadow .2s ease, background .2s ease;
        }

        #importView.drag {
            box-shadow: inset 0 0 0 2px var(--accent);
            background: #fffafa;
        }

        .import-inner {
            padding: 0 24px;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }

        .import-inner h1 {
            font-size: clamp(48px, 9vw, 112px);
            font-weight: 700;
            letter-spacing: -.03em;
            line-height: 1;
        }

        .import-inner .hint {
            margin-top: 24px;
            font-size: clamp(18px, 2.4vw, 28px);
            color: var(--ink);
            transition: color .2s ease;
        }

        #importView.drag .hint {
            color: var(--accent);
        }

        .import-inner .formats {
            margin-top: 16px;
            font-size: 13px;
            letter-spacing: .15em;
            color: var(--gray-2);
        }

        /* ---------- 状态 B：阅读页 ---------- */
        #readerView {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部工具栏：默认隐藏在上方，鼠标悬停顶部下滑出现 */
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 70;
            background: #fff;
            transform: translateY(-100%);
            visibility: hidden;
            transition: transform .25s ease, visibility .25s;
            display: flex;
            align-items: center;
            gap: 8px 24px;
            flex-wrap: wrap;
            padding: 12px 24px;
            border-bottom: 1px solid var(--line);
        }

        #toolbar.open {
            transform: none;
            visibility: visible;
        }

        #fileName {
            font-weight: 600;
            font-size: 15px;
            max-width: 32ch;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #toolbar nav {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px 16px;
            flex-wrap: wrap;
        }

        #toolbar nav button {
            padding: 6px 2px;
            font-size: 14px;
        }

        #toolbar nav button:hover:not(:disabled) {
            color: var(--accent);
        }

        #toolbar nav label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--gray-1);
        }

        #textWrap {
            flex: 1;
            overflow-y: auto;
        }

        #textDisplay {
            max-width: 68ch;
            margin: 0 auto;
            padding: 64px 24px 96px;
            font-size: 18px;
            line-height: 1.8;
        }

        #textDisplay p {
            padding: 6px 16px;
            margin: 2px 0;
            border-left: 3px solid transparent;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: break-word;
            transition: background .15s ease, border-color .15s ease;
        }

        #textDisplay p:hover {
            background: #f7f7f7;
        }

        #textDisplay p.selected {
            background: #f2f2f2;
            border-left-color: var(--gray-2);
        }

        #textDisplay p.playing {
            background: var(--accent-bg);
            border-left-color: var(--accent);
        }

        .highlight {
            background: rgba(227, 6, 19, .18);
        }

        #statusBar {
            border-top: 1px solid var(--line);
            padding: 10px 24px;
            font-size: 13px;
            color: var(--gray-1);
            min-height: 41px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #statusBar .pager {
            margin-left: auto;
            display: flex;
            gap: 4px 16px;
        }

        #statusBar .pager button {
            font-size: 13px;
            color: var(--gray-1);
            padding: 4px 2px;
        }

        #statusBar .pager button:hover:not(:disabled) {
            color: var(--accent);
        }

        /* ---------- 章节浮层（右边缘滑出） ---------- */
        #chapterPanel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            max-width: 85vw;
            background: #fff;
            border-left: 1px solid var(--line);
            transform: translateX(100%);
            visibility: hidden;
            transition: transform .25s ease, visibility .25s;
            display: flex;
            flex-direction: column;
            z-index: 70;
        }

        #chapterPanel.open {
            transform: none;
            visibility: visible;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
            font-size: 15px;
        }

        #chapterList {
            flex: 1;
            overflow-y: auto;
        }

        .chapter-item {
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .chapter-item:hover {
            background: #f7f7f7;
        }

        .chapter-item.active {
            color: var(--accent);
            font-weight: 600;
        }

        .panel-empty {
            padding: 24px 16px;
            font-size: 13px;
            color: var(--gray-2);
        }

        /* ---------- 专注模式 ---------- */
        #focusMode {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity .25s ease, visibility .25s;
        }

        #focusMode.open {
            opacity: 1;
            visibility: visible;
        }

        #focusText {
            max-width: 30em;
            padding: 0 32px;
            font-size: clamp(20px, 3.2vw, 32px);
            line-height: 1.9;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #focusHint {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            color: var(--gray-2);
            letter-spacing: .05em;
        }

        /* ---------- 轻提示 ---------- */
        #toast {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: var(--ink);
            color: #fff;
            font-size: 14px;
            padding: 10px 16px;
            max-width: 70vw;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .2s ease, transform .2s ease;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            transform: none;
        }

        #toast.error {
            background: var(--accent);
        }

        @media (max-width: 640px) {
            #toolbar {
                padding: 10px 16px;
                gap: 6px 12px;
            }

            #fileName {
                max-width: 100%;
                flex-basis: 100%;
            }

            #toolbar nav {
                margin-left: 0;
            }

            #textDisplay {
                padding: 40px 16px 72px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- 状态 A：全屏导入 -->
    <section id="importView">
        <div class="import-inner">
            <h1>TXT 阅读器</h1>
            <p class="hint">拖入或点击导入 TXT</p>
            <p class="formats">.TXT&ensp;.MD&ensp;.JSON</p>
        </div>
        <input type="file" id="fileInput" accept=".txt,.md,.json,.html,.css,.js,.xml,.csv" hidden>
    </section>

    <!-- 状态 B：阅读页 -->
    <section id="readerView" hidden>
        <header id="toolbar">
            <span id="fileName"></span>
            <nav>
                <button id="playBtn">播放</button>
                <button id="stopBtn" disabled>停止</button>
                <label>语音
                    <select id="voiceSelect"></select>
                </label>
                <label>语速
                    <select id="speedSelect">
                        <option value="0.5">0.5x</option>
                        <option value="0.8">0.8x</option>
                        <option value="1">1x</option>
                        <option value="1.2">1.2x</option>
                        <option value="1.5" selected>1.5x</option>
                        <option value="2">2x</option>
                        <option value="2.5">2.5x</option>
                        <option value="3">3x</option>
                    </select>
                </label>
                <button id="saveBtn">存档</button>
                <button id="loadBtn">读档</button>
                <button id="reimportBtn">重新导入</button>
            </nav>
        </header>
        <main id="textWrap">
            <div id="textDisplay"></div>
        </main>
        <footer id="statusBar">
            <span id="statusText"></span>
            <div class="pager">
                <button id="prevBtn">← 上一章</button>
                <button id="nextBtn">下一章 →</button>
            </div>
        </footer>

        <!-- 专注模式：只显示当前朗读的句子 -->
        <div id="focusMode">
            <div id="focusText"></div>
            <div id="focusHint">←/→ 上一句 / 下一句&ensp;·&ensp;↑/↓ 上一章 / 下一章&ensp;·&ensp;空格 播放 / 暂停&ensp;·&ensp;Esc 退出</div>
        </div>
    </section>

    <!-- 章节浮层 -->
    <aside id="chapterPanel">
        <div class="panel-head">章节</div>
        <div id="chapterList"></div>
    </aside>

    <div id="toast"></div>

    <script>
        // 全局状态
        // units：句级单元（与显示段落解耦）
        // { pIdx, start, end, text, global }
        // pIdx       所属显示段落索引
        // start/end  在段落文本内的偏移（用于 Range 高亮）
        // text       朗读文本
        // global     在全文中的偏移（用于章节定位）
        let units = [];
        let displayParagraphs = [];
        let currentFileContent = '';
        let currentUnitIndex = 0;
        let isPlaying = false;
        let voices = [];
        let currentFile = null;
        let userSelectedPosition = false;
        let chapters = [];

        // 分块朗读：把连续多句合并为一个 utterance（块）。
        // 浏览器对每个 utterance 都是开始播放时才合成（在线语音是网络请求），
        // 逐句播放必然有句间延迟；合并成块后，间隙从「每句一次」降为「每块一次」。
        // 块内通过 onboundary 的 charIndex 反推当前句，保持逐句高亮与滚动。
        const CHUNK_MAX = 600;   // 单块最大字符数（约 1–2 分钟音频）
        const QUEUE_AHEAD = 1;   // 预排队的块数
        const CPS = 4.2;         // 无 boundary 事件时的播放速度估算（字/秒，1x 基准）

        let nextChunkFrom = 0;   // 下一个待排队的块起始单元索引
        let pendingCount = 0;    // 已排队未完成的 utterance 数
        let estimateTimer = null;
        let sentenceMode = false; // 分块合成失败时自动降级为逐句播放（保证有声音）

        const synth = window.speechSynthesis;

        // DOM
        const importView = document.getElementById('importView');
        const readerView = document.getElementById('readerView');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const textWrap = document.getElementById('textWrap');
        const textDisplay = document.getElementById('textDisplay');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const loadBtn = document.getElementById('loadBtn');
        const reimportBtn = document.getElementById('reimportBtn');
        const chapterPanel = document.getElementById('chapterPanel');
        const toolbar = document.getElementById('toolbar');
        const chapterList = document.getElementById('chapterList');
        const speedSelect = document.getElementById('speedSelect');
        const voiceSelect = document.getElementById('voiceSelect');
        const statusText = document.getElementById('statusText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const toastEl = document.getElementById('toast');
        const focusMode = document.getElementById('focusMode');
        const focusText = document.getElementById('focusText');

        // ---------- 轻提示 ----------
        let toastTimer = null;
        function toast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.classList.toggle('error', isError);
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
        }

        // ---------- 语音列表 ----------
        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';

            const groups = [
                ['中文语音', voices.filter(v => v.lang.startsWith('zh'))],
                ['英语语音', voices.filter(v => v.lang.startsWith('en'))],
                ['其他语音', voices.filter(v => !v.lang.startsWith('zh') && !v.lang.startsWith('en'))]
            ];

            groups.forEach(([label, list]) => {
                if (!list.length) return;
                const group = document.createElement('optgroup');
                group.label = label;
                list.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.voiceURI;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    group.appendChild(option);
                });
                voiceSelect.appendChild(group);
            });

            const savedVoice = localStorage.getItem('selectedVoice');
            if (savedVoice && voices.some(v => v.voiceURI === savedVoice)) {
                voiceSelect.value = savedVoice;
            } else {
                const xiaoxiao = voices.find(v =>
                    v.name.includes('Xiaoxiao') || v.voiceURI.includes('Xiaoxiao')
                );
                const chinese = voices.filter(v => v.lang.startsWith('zh'));
                if (xiaoxiao) voiceSelect.value = xiaoxiao.voiceURI;
                else if (chinese.length) voiceSelect.value = chinese[0].voiceURI;
                else if (voices.length) voiceSelect.value = voices[0].voiceURI;
            }
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        // ---------- 导入 ----------
        importView.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(ev =>
            importView.addEventListener(ev, e => {
                e.preventDefault();
                importView.classList.add('drag');
            })
        );

        ['dragleave', 'drop'].forEach(ev =>
            importView.addEventListener(ev, e => {
                e.preventDefault();
                importView.classList.remove('drag');
            })
        );

        importView.addEventListener('drop', e => {
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // 阻止浏览器默认拖放行为（避免文件被直接打开）
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        fileInput.addEventListener('change', e => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function isTextFile(file) {
            if (file.type.startsWith('text/')) return true;
            return /\.(txt|md|json|html|css|js|xml|csv|log)$/i.test(file.name);
        }

        function handleFile(file) {
            if (!isTextFile(file)) {
                toast('请导入纯文本文件（.txt / .md / .json 等）', true);
                return;
            }
            const reader = new FileReader();
            reader.onload = e => {
                currentFileContent = decodeBuffer(e.target.result);
                currentFile = file;
                enterReader(file.name);
            };
            reader.onerror = () => toast('文件读取失败', true);
            reader.readAsArrayBuffer(file);
        }

        // 后台静默编码检测：BOM → UTF-8 严格解码 → GBK 回退
        function decodeBuffer(buffer) {
            const bytes = new Uint8Array(buffer);

            if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
                return new TextDecoder('utf-8').decode(bytes);
            }
            if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
                return new TextDecoder('utf-16le').decode(bytes);
            }
            if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
                return new TextDecoder('utf-16be').decode(bytes);
            }
            try {
                return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            } catch (_) {
                try {
                    return new TextDecoder('gb18030').decode(bytes);
                } catch (__) {
                    return new TextDecoder('utf-8').decode(bytes);
                }
            }
        }

        function enterReader(name) {
            fileName.textContent = name;
            processTextContent(currentFileContent);
            displayTextContent();

            importView.hidden = true;
            readerView.hidden = false;

            currentUnitIndex = 0;
            userSelectedPosition = false;
            isPlaying = false;
            sentenceMode = false;
            playBtn.disabled = false;
            stopBtn.disabled = true;
            textWrap.scrollTop = 0;

            updateStatus();
            toast(`已加载：${name}`);

            // 导入即自动播放并进入专注模式
            startReading();
            toggleFocusMode(true);
        }

        // ---------- 文本切分 ----------
        // 把单个显示段落切为句级单元，保留段落内精确偏移
        function splitIntoUnits(pText) {
            const segs = [];
            let start = 0;
            const re = /[。！？；!?;]|\n+/g;
            let m;
            while ((m = re.exec(pText)) !== null) {
                const end = m.index + m[0].length;
                if (pText.slice(start, end).trim()) segs.push({ start, end });
                start = end;
            }
            if (start < pText.length && pText.slice(start).trim()) {
                segs.push({ start, end: pText.length });
            }
            if (!segs.length) return [];

            // 过短的碎片并入上一句
            const merged = [];
            for (const s of segs) {
                if (merged.length && pText.slice(s.start, s.end).trim().length < 12) {
                    merged[merged.length - 1].end = s.end;
                } else {
                    merged.push({ start: s.start, end: s.end });
                }
            }

            // 过长句按逗号或硬切分
            const MAX_LEN = 200;
            const out = [];
            for (const s of merged) {
                let a = s.start;
                while (s.end - a > MAX_LEN) {
                    const win = pText.slice(a, a + MAX_LEN);
                    let cut = Math.max(
                        win.lastIndexOf('，'), win.lastIndexOf('、'),
                        win.lastIndexOf('：'), win.lastIndexOf(':'),
                        win.lastIndexOf(','), win.lastIndexOf(' ')
                    );
                    if (cut < MAX_LEN / 2) cut = MAX_LEN; else cut += 1;
                    out.push({ start: a, end: a + cut });
                    a += cut;
                }
                if (s.end > a && pText.slice(a, s.end).trim()) {
                    out.push({ start: a, end: s.end });
                }
            }
            return out;
        }

        function processTextContent(text) {
            displayParagraphs = text.split(/\n\s*\n/).filter(p => p.trim());
            units = [];

            let searchFrom = 0;
            displayParagraphs.forEach((pText, pIdx) => {
                let g = text.indexOf(pText, searchFrom);
                if (g === -1) g = searchFrom;
                splitIntoUnits(pText).forEach(s => {
                    units.push({
                        pIdx,
                        start: s.start,
                        end: s.end,
                        text: pText.slice(s.start, s.end),
                        global: g + s.start
                    });
                });
                searchFrom = g + pText.length;
            });

            detectChapters(text);
        }

        function detectChapters(text) {
            const chapterRegex = /^第[一二三四五六七八九十零〇百千万\d\s]{1,10}[章节卷集部篇回].+$/gm;
            chapters = [];
            let match;
            while ((match = chapterRegex.exec(text)) !== null) {
                chapters.push({
                    title: match[0].trim(),
                    startIndex: match.index
                });
            }
            displayChapterList();
        }

        function displayChapterList() {
            chapterList.innerHTML = '';

            if (!chapters.length) {
                chapterList.innerHTML = '<div class="panel-empty">未检测到章节</div>';
                return;
            }

            chapters.forEach(chapter => {
                const item = document.createElement('div');
                item.className = 'chapter-item';
                item.textContent = chapter.title;
                item.addEventListener('click', () => {
                    jumpToGlobalOffset(chapter.startIndex);
                    chapterList.querySelectorAll('.chapter-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    chapterPanel.classList.remove('open');
                    toggleFocusMode(true); // 点击章节后回到专注视图
                    setTimeout(updateFocusText, 350);
                });
                chapterList.appendChild(item);
            });
        }

        // 按全文偏移定位朗读单元（章节跳转）
        function jumpToGlobalOffset(globalOffset) {
            const wasPlaying = isPlaying;
            if (isPlaying) pausePlayback();

            let idx = units.findIndex(u => globalOffset < u.global + (u.end - u.start) && globalOffset >= u.global);
            if (idx === -1) {
                idx = units.findIndex(u => u.global >= globalOffset);
            }
            if (idx === -1) idx = 0;

            currentUnitIndex = idx;
            userSelectedPosition = true;

            const p = textDisplay.children[units[idx].pIdx];
            if (p) {
                textDisplay.querySelectorAll('p').forEach(el => el.classList.remove('selected'));
                p.classList.add('selected');
                p.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            updateStatus();

            if (wasPlaying) setTimeout(() => startReading(true), 300);
        }

        function displayTextContent() {
            textDisplay.innerHTML = '';
            displayParagraphs.forEach((paragraph, pIdx) => {
                const p = document.createElement('p');
                p.textContent = paragraph;
                p.dataset.pidx = pIdx;
                addParagraphClickListener(p);
                textDisplay.appendChild(p);
            });
        }

        function addParagraphClickListener(paragraph) {
            // 定位到点击处的句索引并选中
            const locateAt = (e) => {
                const pIdx = parseInt(paragraph.dataset.pidx, 10);

                let offset = 0;
                if (document.caretRangeFromPoint) {
                    const range = document.caretRangeFromPoint(e.clientX, e.clientY);
                    if (range && range.startContainer.nodeType === Node.TEXT_NODE &&
                        paragraph.contains(range.startContainer)) {
                        offset = range.startOffset;
                    }
                }

                let idx = units.findIndex(u => u.pIdx === pIdx && offset < u.end && offset >= u.start);
                if (idx === -1) idx = units.findIndex(u => u.pIdx === pIdx);
                if (idx === -1) return -1;

                currentUnitIndex = idx;
                userSelectedPosition = true;

                textDisplay.querySelectorAll('p').forEach(p => p.classList.remove('selected'));
                paragraph.classList.add('selected');

                updateFocusText();
                updateStatus();
                return idx;
            };

            // 单击：只定位选中；双击则从该句开始播放，此处延迟等待双击判定
            let clickTimer = null;
            paragraph.addEventListener('click', function (e) {
                if (clickTimer) return; // 双击的第二次 click，忽略
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    const wasPlaying = isPlaying;
                    if (isPlaying) pausePlayback();
                    const idx = locateAt(e);
                    if (idx === -1) return;
                    toast(`已选择起始位置：第 ${idx + 1} 句`);
                    if (wasPlaying) setTimeout(() => startReading(true), 300);
                }, 250);
            });

            // 双击：从双击处的句子立即开始朗读（进入专注模式）
            paragraph.addEventListener('dblclick', function (e) {
                e.preventDefault();
                if (clickTimer) { // 取消单击动作
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                if (isPlaying) pausePlayback();
                const idx = locateAt(e);
                if (idx === -1) return;
                window.getSelection()?.removeAllRanges();
                startReading(true);
                toggleFocusMode(true);
            });
        }

        // ---------- 朗读（分块 + 边界跟踪） ----------
        function startReading(skipPositionDetection = false) {
            if (!units.length) return;

            if (currentUnitIndex >= units.length) currentUnitIndex = 0;

            if (!isPlaying && !skipPositionDetection && !userSelectedPosition) {
                currentUnitIndex = getCurrentVisibleUnitIndex();
            }
            userSelectedPosition = false;

            isPlaying = true;
            playBtn.disabled = true;
            stopBtn.disabled = false;

            nextChunkFrom = currentUnitIndex;
            pendingCount = 0;

            // 先清空引擎残留状态再开播：
            // Chromium 下 cancel 后立即 speak 经常直接报错，需留出间隔
            synth.cancel();
            setTimeout(() => {
                if (isPlaying) fillQueue();
            }, 80);

            updateStatus();
        }

        // 从 fromIdx 开始合并连续单元为一个块
        function makeChunk(fromIdx) {
            let text = '';
            const starts = [];
            let end = fromIdx;

            while (end < units.length) {
                const t = units[end].text;
                if (text.length && text.length + 1 + t.length > CHUNK_MAX) break;
                starts.push(text.length ? text.length + 1 : 0);
                text += (text.length ? '\n' : '') + t;
                end++;
            }
            return { from: fromIdx, to: end, text, starts };
        }

        // 保持队列中始终有 QUEUE_AHEAD 个块待播
        function fillQueue() {
            while (isPlaying && pendingCount < QUEUE_AHEAD + 1 && nextChunkFrom < units.length) {
                nextChunkFrom = speakChunk(nextChunkFrom);
            }
        }

        function speakChunk(fromIdx, retries = 0) {
            // 降级模式：每次只读一句（兼容性最好，保证有声音）
            const chunk = sentenceMode
                ? { from: fromIdx, to: fromIdx + 1, text: units[fromIdx].text, starts: [0] }
                : makeChunk(fromIdx);

            const utterance = new SpeechSynthesisUtterance(chunk.text);
            utterance.rate = parseFloat(speedSelect.value);

            const selectedVoice = voices.find(v => v.voiceURI === voiceSelect.value);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            } else if (voices.length) {
                utterance.voice = voices[0];
            }

            pendingCount++;
            let lastUnit = -1;
            let gotBoundary = false;
            let startTime = 0;

            // 块内字符偏移 → 单元索引 → 高亮/滚动/状态
            const locate = (charIndex) => {
                let k = 0;
                for (let i = 0; i < chunk.starts.length; i++) {
                    if (chunk.starts[i] <= charIndex) k = i; else break;
                }
                const unitIdx = chunk.from + k;
                if (unitIdx !== lastUnit) {
                    lastUnit = unitIdx;
                    currentUnitIndex = unitIdx;
                    highlightUnit(units[unitIdx]);
                    updateFocusText();
                    updateStatus();
                }
            };

            const stopEstimation = () => {
                if (estimateTimer) {
                    clearInterval(estimateTimer);
                    estimateTimer = null;
                }
            };

            // 无 boundary 事件的环境：按时间估算播放位置，保证高亮仍然前进
            const startEstimation = () => {
                stopEstimation();
                estimateTimer = setInterval(() => {
                    if (!isPlaying || gotBoundary) { stopEstimation(); return; }
                    const elapsed = (performance.now() - startTime) / 1000;
                    const est = elapsed * parseFloat(speedSelect.value) * CPS;
                    locate(Math.min(est, chunk.text.length - 1));
                }, 250);
            };

            utterance.onstart = () => {
                if (!isPlaying) return;
                startTime = performance.now();
                locate(0);
                // 600ms 内没有 boundary 事件则启用估算兜底
                setTimeout(() => {
                    if (!gotBoundary && isPlaying && startTime) startEstimation();
                }, 600);
            };

            utterance.onboundary = (e) => {
                if (!isPlaying || typeof e.charIndex !== 'number') return;
                gotBoundary = true;
                stopEstimation();
                locate(e.charIndex);
            };

            utterance.onend = () => {
                pendingCount--;
                stopEstimation();
                if (!isPlaying) return;
                if (chunk.to >= units.length) {
                    stopReading();
                    toast('朗读完成');
                    return;
                }
                fillQueue();
            };

            utterance.onerror = (e) => {
                pendingCount--;
                stopEstimation();
                if (e.error === 'canceled' || e.error === 'interrupted') return;
                console.error('语音合成错误:', e.error, '| 文本开头:', chunk.text.slice(0, 20));
                if (!isPlaying) return;

                if (!sentenceMode) {
                    // 分块合成失败：自动降级为逐句播放重试
                    sentenceMode = true;
                    nextChunkFrom = fromIdx;
                    setTimeout(() => { if (isPlaying) fillQueue(); }, 200);
                } else if (retries < 1) {
                    // 单句也失败：间隔后重试一次
                    setTimeout(() => { if (isPlaying) speakChunk(fromIdx, retries + 1); }, 400);
                } else {
                    pausePlayback();
                    toast(`语音合成失败（${e.error || '未知原因'}），请更换语音或换用 Edge 浏览器`, true);
                }
            };

            synth.speak(utterance);
            return chunk.to;
        }

        // 暂停（保留当前位置，供切换句/章节/语速时内部使用）
        function pausePlayback() {
            isPlaying = false;
            pendingCount = 0;
            synth.cancel();
            playBtn.disabled = false;
            stopBtn.disabled = true;
            clearHighlights();
            updateStatus();
        }

        // 停止朗读并回到开头（读完或手动停止共用）
        function stopReading() {
            isPlaying = false;
            pendingCount = 0;
            synth.cancel();
            currentUnitIndex = 0;
            playBtn.disabled = false;
            stopBtn.disabled = true;
            clearHighlights();
            textDisplay.querySelectorAll('p').forEach(p => p.classList.remove('selected'));
            updateStatus();
        }

        function getCurrentVisibleUnitIndex() {
            const wrapRect = textWrap.getBoundingClientRect();
            const center = wrapRect.top + textWrap.clientHeight / 2;
            const paragraphs = textDisplay.querySelectorAll('p');

            for (let i = 0; i < paragraphs.length; i++) {
                const r = paragraphs[i].getBoundingClientRect();
                if (r.top <= center && r.bottom >= center) {
                    const pIdx = parseInt(paragraphs[i].dataset.pidx, 10);
                    const idx = units.findIndex(u => u.pIdx === pIdx);
                    if (idx !== -1) return idx;
                }
            }

            const ratio = (textWrap.scrollTop + textWrap.clientHeight / 2) / Math.max(1, textWrap.scrollHeight);
            return Math.max(0, Math.min(Math.floor(units.length * ratio), units.length - 1));
        }

        // 高亮当前朗读句（段落内 Range 精确高亮 + 按需滚动）
        function highlightUnit(unit) {
            clearHighlights();

            const p = textDisplay.children[unit.pIdx];
            if (!p) return;
            p.classList.add('playing');

            let highlightEl = null;
            const textNode = p.firstChild;
            if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                try {
                    const range = document.createRange();
                    range.setStart(textNode, Math.min(unit.start, textNode.length));
                    range.setEnd(textNode, Math.min(unit.end, textNode.length));
                    const span = document.createElement('span');
                    span.className = 'highlight';
                    range.surroundContents(span);
                    highlightEl = span;
                } catch (e) {
                    // 高亮失败不影响朗读
                }
            }

            ensureVisible(highlightEl || p);
        }

        // 仅当目标即将滚出舒适区时才滚动，避免频繁跳动
        function ensureVisible(el) {
            const wrapRect = textWrap.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            const margin = textWrap.clientHeight * 0.3;
            if (r.top < wrapRect.top + margin * 0.4 || r.bottom > wrapRect.bottom - margin) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function clearHighlights() {
            textDisplay.querySelectorAll('.highlight').forEach(h => {
                const parent = h.parentNode;
                parent.replaceChild(document.createTextNode(h.textContent), h);
                parent.normalize();
            });
            textDisplay.querySelectorAll('p.playing').forEach(p => p.classList.remove('playing'));
        }

        function getCurrentChapterTitle() {
            const unit = units[currentUnitIndex];
            if (!unit) return null;
            for (let i = chapters.length - 1; i >= 0; i--) {
                if (unit.global >= chapters[i].startIndex) return chapters[i].title;
            }
            return null;
        }

        function updateStatus() {
            if (!units.length) {
                statusText.textContent = '';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            const chapter = getCurrentChapterTitle();
            const pos = `第 ${Math.min(currentUnitIndex + 1, units.length)} 句 / 共 ${units.length} 句`;
            statusText.textContent =
                (isPlaying ? '正在朗读 · ' : '') +
                (chapter ? `${chapter} · ` : '') +
                pos;

            // 翻页按钮状态（有章节时到边界禁用，无章节时始终可用）
            if (chapters.length) {
                const cur = getCurrentChapterIdx();
                prevBtn.disabled = cur <= 0;
                nextBtn.disabled = cur >= chapters.length - 1;
            } else {
                prevBtn.disabled = false;
                nextBtn.disabled = false;
            }
        }

        // ---------- 存档 / 读档 ----------
        function saveProgress() {
            if (!currentFileContent || !units.length) {
                toast('请先加载文本文件', true);
                return;
            }

            localStorage.setItem('readingProgress', JSON.stringify({
                fileName: fileName.textContent,
                sentenceIndex: currentUnitIndex,
                totalSentences: units.length,
                saveTime: new Date().toISOString()
            }));

            const chapter = getCurrentChapterTitle();
            toast(chapter
                ? `已存档：${chapter}`
                : `已存档：第 ${currentUnitIndex + 1} 句 / 共 ${units.length} 句`);
        }

        function loadProgress() {
            const savedData = localStorage.getItem('readingProgress');
            if (!savedData) {
                toast('没有找到存档记录', true);
                return;
            }

            try {
                const data = JSON.parse(savedData);
                if (typeof data.sentenceIndex !== 'number' || !data.totalSentences) {
                    toast('存档数据无效', true);
                    return;
                }

                if (data.fileName !== fileName.textContent) {
                    toast(`存档来自：${data.fileName}，已按当前文本读取`);
                }

                currentUnitIndex = Math.max(0, Math.min(data.sentenceIndex, units.length - 1));
                userSelectedPosition = true;

                const unit = units[currentUnitIndex];
                if (unit) {
                    const p = textDisplay.children[unit.pIdx];
                    if (p) p.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                const chapter = getCurrentChapterTitle();
                toast(chapter
                    ? `读档成功：${chapter}`
                    : `读档成功：第 ${currentUnitIndex + 1} 句 / 共 ${units.length} 句`);

                startReading(true);
            } catch (e) {
                console.error('读取存档失败:', e);
                toast('读取存档失败，存档数据可能已损坏', true);
            }
        }

        // ---------- 专注模式 ----------
        // 播放即进入：只显示当前朗读的句子，居中呈现；仅 Esc 退出
        function updateFocusText() {
            if (!focusMode.classList.contains('open')) return;
            const unit = units[currentUnitIndex];
            focusText.textContent = unit ? unit.text.trim() : '';
        }

        function toggleFocusMode(force) {
            const open = typeof force === 'boolean' ? force : !focusMode.classList.contains('open');
            if (open && !units.length) return;
            focusMode.classList.toggle('open', open);
            if (open) updateFocusText();
        }

        document.addEventListener('keydown', e => {
            if (!focusMode.classList.contains('open')) return;
            if (e.key === 'Escape') {
                toggleFocusMode(false);
            } else if (e.key === ' ') {
                e.preventDefault();
                if (isPlaying) {
                    pausePlayback(); // 暂停：保留当前句位置
                } else {
                    startReading(true); // 恢复：从暂停的句子继续（true=不做位置检测）
                }
                updateFocusText();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (currentUnitIndex < units.length - 1) {
                    currentUnitIndex++;
                    userSelectedPosition = true;
                    if (isPlaying) { pausePlayback(); setTimeout(() => startReading(true), 100); }
                    updateFocusText();
                    updateStatus();
                }
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentUnitIndex > 0) {
                    currentUnitIndex--;
                    userSelectedPosition = true;
                    if (isPlaying) { pausePlayback(); setTimeout(() => startReading(true), 100); }
                    updateFocusText();
                    updateStatus();
                }
            } else if (e.key === 'ArrowDown') { // 下一章
                e.preventDefault();
                flipPage(1);
                setTimeout(updateFocusText, 350);
            } else if (e.key === 'ArrowUp') { // 上一章
                e.preventDefault();
                flipPage(-1);
                setTimeout(updateFocusText, 350);
            }
        });

        // ---------- 事件 ----------
        playBtn.addEventListener('click', () => {
            startReading();
            toggleFocusMode(true); // 播放即进入专注模式
        });
        stopBtn.addEventListener('click', stopReading);
        saveBtn.addEventListener('click', saveProgress);
        loadBtn.addEventListener('click', loadProgress);

        // 边缘滑出：右=章节目录，顶=工具栏
        // 鼠标在边缘悬停 0.5 秒才唤出（防误触）；用 mousemove 坐标判断，不受层叠遮挡影响
        const HOVER_DELAY = 500;
        const EDGE_RIGHT = 80; // 右侧章节目录触发宽度（px）
        const EDGE_TOP = 24;   // 顶部工具栏触发高度（px）
        let edgeTimer = null;

        document.addEventListener('mousemove', e => {
            if (readerView.hidden) return;

            const nearRight = e.clientX >= window.innerWidth - EDGE_RIGHT
                && e.clientX <= window.innerWidth;
            const nearTop = e.clientY >= 0 && e.clientY <= EDGE_TOP;
            const zone = (!chapterPanel.classList.contains('open') && nearRight) ? chapterPanel
                : (!toolbar.classList.contains('open') && nearTop) ? toolbar
                    : null;

            if (zone) {
                if (!edgeTimer) {
                    const z = zone;
                    edgeTimer = setTimeout(() => {
                        edgeTimer = null;
                        z.classList.add('open');
                    }, HOVER_DELAY);
                }
            } else if (edgeTimer) { // 移出边缘，取消待唤出
                clearTimeout(edgeTimer);
                edgeTimer = null;
            }
        });

        // 鼠标一旦离开页面区域（移到浏览器标签栏/书签栏/窗口外），
        // 立即取消待唤出并收起所有面板——页面外的鼠标与页面无关
        document.addEventListener('mouseout', e => {
            if (e.relatedTarget) return; // 仍在文档内元素间移动
            clearTimeout(edgeTimer);
            edgeTimer = null;
            chapterPanel.classList.remove('open');
            toolbar.classList.remove('open');
        });

        // 鼠标离开面板后收回
        [chapterPanel, toolbar].forEach(panel => {
            panel.addEventListener('mouseleave', () => {
                setTimeout(() => panel.classList.remove('open'), 150);
            });
        });

        // 上一章 / 下一章：有章节按章节跳，无章节按屏翻页
        function getCurrentChapterIdx() {
            const unit = units[currentUnitIndex];
            if (!unit || !chapters.length) return -1;
            let idx = 0;
            for (let i = 0; i < chapters.length; i++) {
                if (unit.global >= chapters[i].startIndex) idx = i; else break;
            }
            return idx;
        }

        function flipPage(direction) {
            if (!units.length) return;
            if (chapters.length) {
                const cur = getCurrentChapterIdx();
                const target = direction > 0
                    ? (cur < 0 ? 0 : Math.min(cur + 1, chapters.length - 1))
                    : Math.max(cur - 1, 0);
                if (target === cur && direction > 0 && cur === chapters.length - 1) {
                    toast('已经是最后一章');
                    return;
                }
                jumpToGlobalOffset(chapters[target].startIndex);
            } else {
                textWrap.scrollBy({
                    top: direction * textWrap.clientHeight * 0.9,
                    behavior: 'smooth'
                });
            }
        }

        prevBtn.addEventListener('click', () => flipPage(-1));
        nextBtn.addEventListener('click', () => flipPage(1));

        reimportBtn.addEventListener('click', () => {
            stopReading();
            toggleFocusMode(false);
            chapterPanel.classList.remove('open');
            toolbar.classList.remove('open');
            readerView.hidden = true;
            importView.hidden = false;
            fileInput.value = '';
        });

        speedSelect.addEventListener('change', () => {
            if (isPlaying) {
                pausePlayback();
                setTimeout(() => startReading(true), 100);
            }
        });

        voiceSelect.addEventListener('change', () => {
            localStorage.setItem('selectedVoice', voiceSelect.value);
            if (isPlaying) {
                pausePlayback();
                setTimeout(() => startReading(true), 100);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (synth.speaking) synth.cancel();
        });

        // 初始化
        loadVoices();
    </script>
</body>

</html>
